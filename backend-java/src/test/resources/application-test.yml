# ─── Test profile ──────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:fpl_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  fpl:
    team-id: 0
    api-base-url: https://fantasy.premierleague.com/api
  ml-service:
    base-url: http://localhost:8000
